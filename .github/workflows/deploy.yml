name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Write APM config
        env:
          APM_SECRET_TOKEN: ${{ secrets.APM_SECRET_TOKEN }}
        run: |
          if [ -n "$APM_SECRET_TOKEN" ]; then
            printf "<?php\nreturn ['url' => 'https://apm.jonasdlm.be', 'token' => '%s'];\n" "$APM_SECRET_TOKEN" > includes/apm.local.php
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/elena/
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            **/CLAUDE.md
            **/data/users/**
            **/data/progress/**
            **/data/ratelimit/**
            **/toetsen/**
            **/setup.php
